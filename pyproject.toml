[build-system]
requires = ["setuptools>=70", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "docharvester"
version = "0.1.0"
description = "Cross-platform CLI to pull docs (GitHub/HTML/PDF/EPUB) and export clean Markdown."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "DocHarvester Contributors" }]
dependencies = [
  "typer>=0.12",
  "rich>=13.7",
  "httpx>=0.27",
  "platformdirs>=4.2",
  "beautifulsoup4>=4.12",
  "lxml>=5.2",
  "markdownify>=0.13",
  "trafilatura>=1.8",
  "pydantic>=2.6",
  "PyMuPDF>=1.24",
  "EbookLib>=0.18",
  "tqdm>=4.66",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
docharvester = "docharvester.cli:app"
docpull = "docharvester.cli:app"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

